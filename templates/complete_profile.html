<!DOCTYPE html>

<html>

<head>

    <title>Complete Profile - Goinn</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

</head>

<body>

    <h1>Complete Your Goinn Profile</h1>

    <p>
        Welcome to Goinn!
    </p>

    <p>
        Please provide your contact number to continue.
    </p>


    {% if error %}

        <p style="color: red;">
            {{ error }}
        </p>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('complete_profile') }}"
    >

        <label>
            Name
        </label>

        <br>

        <input
            type="text"
            name="name"
            value="{{ name }}"
            required
        >

        <br><br>


        <label>
            Email
        </label>

        <br>

        <input
            type="email"
            value="{{ email }}"
            readonly
        >

        <br><br>


        <label>
            Contact Number *
        </label>

        <br>

        <input
            type="tel"
            name="contact"
            placeholder="Enter contact number"
            required
        >

        <br><br>


        <button type="submit">
            Continue
        </button>

    </form>

</body>

</html>
